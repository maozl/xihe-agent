[project]
name = "xihe-agent"
version = "1.0.0"
license = {text = "MPL-2.0"}
requires-python = ">=3.10"
dependencies = [
    "openai>=1.40.0",
    "aiohttp>=3.10.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
    "mcp>=1.2.0,<2",
    "playwright>=1.40",
    "paramiko>=3.0",
    "prompt_toolkit>=3.0",
    "RestrictedPython>=8.0",
    "textual>=0.8",
    "pyautogui>=0.9.54",
    "pywin32>=306; sys_platform == \"win32\"",
    "pywinauto>=0.6.8; sys_platform == \"win32\"",
    "pyobjc-framework-Quartz; sys_platform == \"darwin\"",
    "psutil>=5.9",
    "paddleocr>=3.7,<4",
    "paddlepaddle>=3.0",
    # Test dependency. Kept in the main list so `pip install -e .` in a dev
    # environment pulls it; mirrored in requirements.txt.
    "pytest>=7.0",
]

[project.scripts]
xihe = "app.main:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["app*", "core*", "gateway*", "cli*", "tools*", "skills*", "agents*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = "test_*.py"
addopts = "-q"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
