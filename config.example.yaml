# =============================================================================
# xihe-agent 配置模板（仅供参考，不参与加载）
# -----------------------------------------------------------------------------
# 这是配置 *结构* 的参考。xihe启动时只读一个 config.yaml：
#   - 由 `--config <path>` 指定（最高优先），或
#   - 默认 ~/.xihe-agent/config.yaml
# 所有配置项（含凭据）都写在这一个文件里，字面值 —— 不再支持 ${VAR} 展开、
# 不再读 .env、不再有环境变量覆盖。把本文件复制到 ~/.xihe-agent/config.yaml
# （或你的实例目录）后按需修改即可。
# =============================================================================

# 数据根（仅 `--config <instance>.yaml` 实例配置里写才生效）---------------------
# agent_home: ~/xihe-instance   # 该实例的数据根：sessions.db / agent.log / browser /
#                               # skills / cron / .biz_kbs 全在这下面。相对路径相对
#                               # 仓库根解析。不写则默认 ~/.xihe-agent。

# 主模型 / 视觉模型 / 循环参数 / 主 agent 名单 ----------------------------------
model: glm-5.2-zp            # 主模型（默认非多模态）
base_url: https://api.openai.com/v1   # OpenAI 兼容端点
api_key: ""                  # 必填：留空则 xihe chat / xihe gateway 拒绝启动
toolsets: ["files", "terminal", "agent", "external_agents", "communication", "memory", "http", "mcp", "kbs", "scheduler"]
                            # 主 agent 的 toolsets（与专家 agents/*.yaml 同一套
                            # 语义：不写或 [] = 不加载，["*"] = 全量，
                            # mcp = 全部 MCP 服务器，mcp-<server> = 单服务器；
                            # 可用名：web/files(写)/terminal/computer(桌面)/dev_tool/
                            # http/memory(写)/communication/media/agent/
                            # external_agents/skills(管理)/scheduler/mcp/ssh/
                            # kbs(初始化)/meta(工具自扩展)。
                            # 读面（read_file/search_files/directory_tree、skills_list/
                            # skill_view、memory 读、kbs_search、todo、model_info）经
                            # base 组自动并入每个非空名单，不用配。推荐主 agent 只当
                            # 协调者，专业工具交给专家 agent / delegate_task
skills: []                # 技能索引：不写 = 不注入；["*"] = 全部；或列技能名
vision_model:                # 填一个多模态模型（如 gpt-4o）才启用 vision_analyze
max_iterations: 30           # 单轮最大工具调用迭代数
max_completion_tokens: 8192  # 单次模型回复的输出 token 上限（默认 8192）。
                             # 长报告/长代码单轮写不完会被拦腰截断——按需调大
compression_threshold: 0.30  # 历史超过模型上下文窗口的比例时触发压缩
language: zh                 # 思考/回复语言引导：zh | en | auto（不引导，模型自选）。
                             # 作用于主/子/专家 agent 的系统提示词，zh 时 external_agent
                             # 给 claude 的 prompt 附带"思考用中文"指令

# 专家 agent 委派开关 ------------------------------------------------------------
# 只管用户自定义的 agents/*.yaml，默认关闭（普通用户不需要自建专家委派）。
# 产品内置专家（src/agents/ 里的 explore / coder / xihe_guide 等）不受此开关
# 影响，始终注册（主 agent 的 toolsets 含 agent 时即可用）。内置专家优先于
# 同名用户文件：用户目录的同名 yaml 只是 delta，仅 enabled / model / base_url
# / api_key / max_iterations 这些键生效——例：
#   ~/.xihe-agent/agents/coder.yaml 内容仅 `enabled: false`   → 停用内置 coder
#   内容 `model: glm-flash`                                    → 给 coder 换便宜模型
# 内容键（persona/toolsets 等）是产品所有的，写了也会被忽略。
specialists:
  enabled: false              # true = 主 agent 可把任务委派给自建专家 agent

# 会话上下文加载控制（xihe.md / AGENTS.md 始终加载）----------------------------
session:
  load_claude_md: true       # 是否把工作目录的 CLAUDE.md 注入系统提示
  load_cursorrules: true     # 是否加载 .cursorrules

# 业务知识库（.biz_kbs 协议；可选）---------------------------------------------
# 根目录固定为 <agent_home>/.biz_kbs —— 跟随数据根，不单独配路径。
# kbs_init 在此 stamp 空脚手架；kbs_status / kbs_search 读写这里。
kbs:
  enabled: false              # 关闭则 kbs_* 工具不暴露、不注入 kbs 前导

# 模型目录（context_length 用于压缩阈值计算）----------------------------------
# 解析优先级：本段 context_length > 内置 known-models 表（core/model_catalog.py，
# 覆盖 glm/doubao/deepseek/gpt 常见型号）> 模型名里的 -32k/-128k 后缀 > 128k 默认。
# /model 与 model_info 还会从 base_url 的 GET /models 自动发现模型 ID（无需在本段
# 手抄型号名；端点不提供该接口则静默为空）。新型号先不登记也行，压缩偏保守；
# 数值不准时在本段补一条即可，永远优先于内置表。
models:
  glm-5.2-zp:
    context_length: 128000
    description: 智谱 GLM-5.2

# 平台适配器配置（gateway 模式用；每个平台一个 section）------------------------
# 凭据直接写字面值（单源 config.yaml，不再走 ${VAR} / .env）。
# 不写时 gateway 启动会明确报缺哪些字段；占位假值只会变成连接失败，别留。
# platforms:
#   wecom:
#     bot_id: "your-wecom-bot-id"
#     secret: "your-wecom-secret"
#     ws_url: "wss://your-wecom-ws-url"
#   # feishu:
#   #   app_id: "..."
#   #   app_secret: "..."
#   #   verification_token: "..."

# MCP 服务器（按名注册；type 通常为 streamable-http / stdio）-------------------
# 启动时会逐一连接这里配置的服务器——占位地址每次启动都报连接失败，
# 填真实地址后再取消注释。
# mcp_servers:
#   example-http:
#     type: streamable-http
#     url: "https://example.invalid/mcp"
#     timeout: 120

# 能力商店（可选；桌面「商店」页浏览/安装 skill 与 MCP 的目录源）----------------
# url 指向一个静态 index.json（http(s) 或本地路径）。商店安装的 MCP 写
# ~/.xihe-agent/store/ 台账并与上面手写的 mcp_servers 合并（同名手写优先）；
# 商店不程序改写本文件。
# store:
#   sources:
#     - name: internal
#       url: https://内网静态服务/xihe-store/index.json
#     - name: dev-local                # 本地目录源（开发/共享盘）
#       url: E:/xihe-store/index.json

# 辅助 LLM（工具内部调用：视觉、压缩、标题；与主模型可不同）---------------------
auxiliary:
  vision:
    model: ""               # 留空则回退 vision_model / 主模型
  image_gen:
    enabled: false          # 关闭则 image_generation 工具不暴露
  tts:
    enabled: false          # 关闭则语音合成相关工具不暴露

# 联网搜索 key（留空 → 对应工具被 check_fn 丢弃，不暴露）-----------------------
web:
  tavily:
    api_key: ""
  serpapi:
    api_key: ""
  bing:
    api_key: ""
  firecrawl:
    api_key: ""

# 浏览器工具 ------------------------------------------------------------------
browser:
  cdp_port: 9222            # 复用系统 Chrome/Edge 的 CDP 端口

# 危险操作审批 ----------------------------------------------------------------
# 一次工具调用走这条决策链，从上到下首个命中生效：
#
#   1. mode: auto            → 全部放行（下面所有层全部跳过，含 deny！
#                              auto 是字面意义的裸奔，deny 也拦不住）
#   2. deny 规则             → 直接拒绝，不弹窗不等待
#   3. allow 规则 + 审批记忆  → 放行
#   4. ask 规则              → 弹人工确认（allow 排在前面，所以 allow 可以
#                              对 ask 圈的工具开小灶，见 allow 的例子）
#   5. 内置危险判定（无需配置，manual 下自动生效）
#                           → terminal 命令匹配危险模式（rm -r、mkfs、
#                              DROP TABLE、curl|sh、fork bomb 等 24 条，
#                              Unix + Windows 都有）；或命中高危工具
#                              （ssh_exec、process stop、computer_app close、
#                              browser_logout、skill_manage 删除、
#                              kbs_init force、cronjob 删除、node_version
#                              安装卸载）→ 弹人工确认
#   6. LLM 语义判定（llm_judge）→ 第 5 层正则漏网的 terminal 命令，含
#                              删除/破坏/系统类动词才调辅助模型判意图；
#                              判定失败放行，不卡流程
#   都没命中 → 放行
#
approvals:
  mode: manual              # manual（默认）= 走上面六层 | auto = 全放行（连 deny 都跳过）
  timeout: 300              # 弹出确认后等待答复的秒数，超时按 timeout_action
  timeout_action: deny      # 超时后 deny = 拒绝 | allow = 放行
  llm_judge: true           # 第 6 层开关。判定模型配 auxiliary.approval_judge.model（默认主模型）
  memory_days: 30           # 审批记忆保留天数（非法值回落 30）
  deny: []                  # 第 2 层：命中即拒。例：
                            #   - "terminal(*mkfs*)"
                            #   - "ssh_exec"
  ask:                      # 第 4 层：命中即弹确认。在危险判定（第 5 层）
                            # 之外自己圈要确认的工具，加一行即拦：
    - write_file            #   写文件首问一次，"不再问"后本维度放行
    - patch                 #   与 write_file 分开授权
    # - computer_click       #   桌面操作要逐次确认时取消注释
    # - computer_type
  allow: []                 # 第 3 层：命中即放行（优先于 ask，可开小灶）。例：
                            #   - "terminal(rm -rf /tmp/*)"
                            #   - "node_version(install *)"
                            #   - "write_file(src/**)"     # ask 圈了 write_file
                            #                             # 但 src/ 下免问
                            #                             # write_file 时 src/ 免问

# 外置 agent 接入（claude / codex 作为 xihe 的 external_agent 工具）-----------
external_agents:
  claude:
    command: claude         # 可执行文件名或绝对路径
    api_key: ""             # claude 专用 key（留空则回退主 api_key）
    base_url: ""            # 留空则回退主 base_url
    extra_args: []          # 原样追加到 claude 参数（--resume 之前），例如：
                            # --settings <json>、--disallowedTools …
    max_tokens: 0           # >0 → 注入 CLAUDE_CODE_MAX_OUTPUT_TOKENS 环境变量，
                            # 抬高单轮回复的输出上限；0/不写 = claude 自身默认
    debug: false            # true → 完整 prompt + NDJSON 流量记到
                            # agent_home/external-agent-trace.log（排查用，平时关）
    # permission_mode: bypassPermissions   # claude --permission-mode 值
  codex:
    command: codex          # codex CLI（0.146+）
    api_key: ""             # 注入为 CODEX_API_KEY（留空则回退主 api_key）
    base_url: ""            # 留空 = provider 完全交给 ~/.codex/config.toml
                            # （不回退主 base_url——避免悄悄改写 config.toml
                            # 选好的 provider）。设置后 xihe 经 exec -c 内联
                            # 定义 provider（id 固定 xihe，env_key=CODEX_API_KEY）
                            # 覆盖该轮的 provider 选择；值原样透传（codex 在
                            # 其后拼 /responses 或 /chat/completions）。
    wire_api: responses     # responses | chat，仅 base_url 设置时生效；默认
                            # responses（内部 litellm 网关实测可用）
    max_tokens: 0           # >0 → exec -c model_max_output_tokens=<n>。注意：实测
                            # codex 0.146 对自定义 provider 不应用该键（网关按自身
                            # 默认上限截断，约 8k）——生效与否取决于 codex 版本；
                            # 不写 = 不干预
    extra_args: []          # 原样追加到 exec 参数（resume/“-” 之前）的逃生口，
                            # 例如 ['-c', 'model_reasoning_effort=high']、
                            # --ephemeral、--add-dir <dir>；-c 值按 TOML 解析，
                            # 普通字符串可不加引号
    debug: false
    # permission_mode: workspace-write     # codex 原生枚举：read-only |
    #                                      # workspace-write | danger-full-access；
    #                                      # 另接受 bypassPermissions 作跨引擎
    #                                      # 别名 → --dangerously-bypass-approvals-and-sandbox
    # model: ""              # 留空则用 ~/.codex/config.toml 的 model

# CLI 显示 --------------------------------------------------------------------
cli:
  no_ansi: false            # true → 强制单色输出
  force_ansi: false         # true → 强制彩色输出

# 日志脱敏 --------------------------------------------------------------------
redact:
  enabled: true             # 是否在日志里脱敏 key/token/secret
